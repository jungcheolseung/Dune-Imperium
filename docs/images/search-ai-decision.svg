<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" role="img" aria-labelledby="title desc">
<title id="title">탐색 AI의 결정 하나</title>
<desc id="desc">지금 결정에서 학습 망이 후보 다섯 개를 고르고, 후보마다 숨은 정보를 다르게 나눈 가상 세계 여덟 개에서 이번 라운드 끝까지 두어 본 뒤 평균이 가장 좋은 후보를 고른다. 이 예에서는 망의 2순위 후보가 선택된다.</desc>
<style>
text { font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; }
.t { font-size: 14px; fill: #2c2c2a; }
.th { font-size: 14px; font-weight: 500; fill: #2c2c2a; }
.ts { font-size: 12px; fill: #5f5e5a; }
.box { fill: #f1efe8; stroke: #b4b2a9; stroke-width: 0.5; }
.pick { fill: #e1f5ee; stroke: #0f6e56; stroke-width: 1; }
.pickt { font-size: 14px; font-weight: 500; fill: #085041; }
.arr { stroke: #888780; stroke-width: 1.5; fill: none; }
.good { fill: #ef9f27; }
.bad { fill: #d3d1c7; }
@media (prefers-color-scheme: dark) {
  .t, .th { fill: #e8e6df; }
  .ts { fill: #b4b2a9; }
  .box { fill: #2c2c2a; stroke: #5f5e5a; }
  .pick { fill: #085041; stroke: #5dcaa5; }
  .pickt { fill: #e1f5ee; }
  .bad { fill: #5f5e5a; }
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="ts" x="295" y="40" text-anchor="middle">학습 망이 고른 후보</text>
<text class="ts" x="481" y="40" text-anchor="middle">가상 세계 8개에서 두어 보기</text>
<text class="ts" x="600" y="40" text-anchor="middle">평균</text>
<rect class="box" x="40" y="162" width="130" height="56" rx="8"/>
<text class="th" x="105" y="181" text-anchor="middle" dominant-baseline="central">지금 결정</text>
<text class="ts" x="105" y="200" text-anchor="middle" dominant-baseline="central">합법 수 12개</text>
<line x1="170" y1="190" x2="216" y2="80" class="arr" marker-end="url(#arrow)"/>
<line x1="170" y1="190" x2="216" y2="135" class="arr" marker-end="url(#arrow)"/>
<line x1="170" y1="190" x2="216" y2="190" class="arr" marker-end="url(#arrow)"/>
<line x1="170" y1="190" x2="216" y2="245" class="arr" marker-end="url(#arrow)"/>
<line x1="170" y1="190" x2="216" y2="300" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="220" y="60" width="150" height="40" rx="8"/>
<text class="t" x="295" y="80" text-anchor="middle" dominant-baseline="central">후보 1 (망 1순위)</text>
<rect class="pick" x="220" y="115" width="150" height="40" rx="8"/>
<text class="pickt" x="295" y="135" text-anchor="middle" dominant-baseline="central">후보 2 (망 2순위)</text>
<rect class="box" x="220" y="170" width="150" height="40" rx="8"/>
<text class="t" x="295" y="190" text-anchor="middle" dominant-baseline="central">후보 3</text>
<rect class="box" x="220" y="225" width="150" height="40" rx="8"/>
<text class="t" x="295" y="245" text-anchor="middle" dominant-baseline="central">후보 4</text>
<rect class="box" x="220" y="280" width="150" height="40" rx="8"/>
<text class="t" x="295" y="300" text-anchor="middle" dominant-baseline="central">후보 5</text>
<circle class="good" cx="404" cy="80" r="7"/><circle class="bad" cx="426" cy="80" r="7"/><circle class="good" cx="448" cy="80" r="7"/><circle class="bad" cx="470" cy="80" r="7"/><circle class="bad" cx="492" cy="80" r="7"/><circle class="good" cx="514" cy="80" r="7"/><circle class="bad" cx="536" cy="80" r="7"/><circle class="bad" cx="558" cy="80" r="7"/>
<circle class="good" cx="404" cy="135" r="7"/><circle class="good" cx="426" cy="135" r="7"/><circle class="bad" cx="448" cy="135" r="7"/><circle class="good" cx="470" cy="135" r="7"/><circle class="good" cx="492" cy="135" r="7"/><circle class="good" cx="514" cy="135" r="7"/><circle class="bad" cx="536" cy="135" r="7"/><circle class="good" cx="558" cy="135" r="7"/>
<circle class="bad" cx="404" cy="190" r="7"/><circle class="bad" cx="426" cy="190" r="7"/><circle class="good" cx="448" cy="190" r="7"/><circle class="bad" cx="470" cy="190" r="7"/><circle class="bad" cx="492" cy="190" r="7"/><circle class="bad" cx="514" cy="190" r="7"/><circle class="bad" cx="536" cy="190" r="7"/><circle class="bad" cx="558" cy="190" r="7"/>
<circle class="bad" cx="404" cy="245" r="7"/><circle class="good" cx="426" cy="245" r="7"/><circle class="bad" cx="448" cy="245" r="7"/><circle class="bad" cx="470" cy="245" r="7"/><circle class="good" cx="492" cy="245" r="7"/><circle class="bad" cx="514" cy="245" r="7"/><circle class="good" cx="536" cy="245" r="7"/><circle class="bad" cx="558" cy="245" r="7"/>
<circle class="bad" cx="404" cy="300" r="7"/><circle class="bad" cx="426" cy="300" r="7"/><circle class="bad" cx="448" cy="300" r="7"/><circle class="bad" cx="470" cy="300" r="7"/><circle class="bad" cx="492" cy="300" r="7"/><circle class="bad" cx="514" cy="300" r="7"/><circle class="bad" cx="536" cy="300" r="7"/><circle class="bad" cx="558" cy="300" r="7"/>
<text class="ts" x="600" y="80" text-anchor="middle" dominant-baseline="central">0.31</text>
<text class="th" x="600" y="135" text-anchor="middle" dominant-baseline="central">0.58 선택</text>
<text class="ts" x="600" y="190" text-anchor="middle" dominant-baseline="central">0.12</text>
<text class="ts" x="600" y="245" text-anchor="middle" dominant-baseline="central">0.25</text>
<text class="ts" x="600" y="300" text-anchor="middle" dominant-baseline="central">0.05</text>
<text class="ts" x="340" y="345" text-anchor="middle">점 하나 = 숨은 카드를 다르게 나눈 세계 하나에서 이번 라운드 끝까지 두어 본 결과</text>
<text class="ts" x="340" y="365" text-anchor="middle">주황 = 유리하게 끝남, 회색 = 불리하게 끝남 (그림의 숫자는 예시)</text>
</svg>
