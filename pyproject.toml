[project]
name = "dune"
version = "0.1.0"
description = "A Python implementation of Dune: Imperium - Uprising for AI research"
authors = [
    { name = "Cheolseung Jung", email = "jung.cheolseung@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.2.0",
    "pycodestyle>=2.10.0",
    "pylint>=2.17.2",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dune"
module-root = ""
