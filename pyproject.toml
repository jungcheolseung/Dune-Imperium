[project]
name = "dune-imperium"
version = "0.1.0"
description = "A Python implementation of Dune: Imperium - Uprising for AI research"
authors = [
    { name = "Cheolseung Jung", email = "jung.cheolseung@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.2.0",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dune_imperium"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.14"
strict = true
