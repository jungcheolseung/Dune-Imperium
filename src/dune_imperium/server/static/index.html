<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dune: Imperium — Uprising</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Dune: Imperium — Uprising</h1>
    <div id="header-status"></div>
    <span id="connection-note" hidden>서버 연결 끊김 — 다시 연결하는 중…</span>
    <button id="open-lobby" hidden>좌석</button>
    <button id="save-game" hidden>저장</button>
    <button id="leave-game" hidden>나가기</button>
  </header>

  <main>
    <section id="setup-screen" class="panel">
      <h2>새 게임</h2>
      <form id="setup-form">
        <fieldset>
          <legend>좌석 배정</legend>
          <div id="seat-selects"></div>
          <label>체크포인트 경로 (좌석에 "학습 체크포인트"를 고르면 사용; train extra 필요)
            <input type="text" id="opt-checkpoint" placeholder="checkpoints/2026-09-06/champion_iter200.pt"></label>
        </fieldset>
        <fieldset>
          <legend>규칙 옵션</legend>
          <label><input type="checkbox" id="opt-leader-draft" checked>
            Leader 6종 공개 draft (OQ-007 convention)</label>
          <label><input type="checkbox" id="opt-choam">
            CHOAM Module</label>
          <label><input type="checkbox" id="opt-promo">
            프로모 카드 (Uprising 3장: Arrakis Revolt, The Beast's Spoils, Pivotal Gambit; Bloodlines를 켜면 Ruthless Leadership도)</label>
          <label><input type="checkbox" id="opt-bloodlines">
            Bloodlines 확장 (Sardaukar Commander·새 카드·Leader 8종)</label>
          <label><input type="checkbox" id="opt-tech">
            Tech Module (Bloodlines 필요: Ixian Embassy·Tech tile 18장·Kota Odax)</label>
          <label><input type="checkbox" id="opt-immortality">
            Immortality 확장 (Bene Tleilax board·Tleilaxu Row·Graft·새 카드)</label>
          <label id="opt-seed-row">Seed (빈칸 = 무작위)
            <input type="number" id="opt-seed" min="0" placeholder="무작위"></label>
        </fieldset>
        <button type="submit" id="create-game">게임 시작</button>
      </form>
      <div id="game-list-wrap" hidden>
        <h2>진행 중인 게임</h2>
        <ul id="game-list"></ul>
      </div>
      <div id="save-list-wrap" hidden>
        <h2>저장된 게임</h2>
        <ul id="save-list"></ul>
      </div>
      <p id="setup-error" class="error" hidden></p>
    </section>

    <section id="landing-screen" class="panel" hidden>
      <h2>초대받은 사람만 들어올 수 있는 서버입니다</h2>
      <p>호스트가 보낸 방 링크로 접속하세요.</p>
      <p class="muted">호스트라면 서버를 띄운 콘솔에 찍힌 관리자 링크를 여세요.</p>
      <p id="landing-resume" hidden>
        <button type="button" id="landing-resume-button">마지막으로 있던 방으로 이어 하기 ▶</button></p>
      <p id="landing-error" class="error" hidden></p>
    </section>

    <section id="lobby-screen" class="panel" hidden>
      <h2>좌석 고르기</h2>
      <p id="lobby-status" class="muted"></p>
      <label>이름 (다른 플레이어에게 보입니다)
        <input type="text" id="lobby-name" maxlength="20" autocomplete="off"></label>
      <ul id="lobby-seats"></ul>
      <p id="lobby-error" class="error" hidden></p>
      <p id="lobby-note" class="muted" hidden></p>
      <button id="lobby-enter" hidden>게임 화면으로 ▶</button>
      <div id="lobby-host" hidden></div>
    </section>

    <section id="game-screen" hidden>
      <div id="table">
        <aside id="seats" aria-label="좌석"></aside>
        <div id="center">
          <section id="board" aria-label="게임 보드"></section>
          <section id="market" aria-label="공용 카드"></section>
        </div>
        <aside id="side">
          <div id="side-main">
            <details id="host-panel" class="panel" hidden>
              <summary>호스트 · 방 링크와 좌석</summary>
              <div id="host-panel-body"></div>
            </details>
            <section id="decision-banner" class="panel">
              <div id="decision-info"></div>
              <div id="actions"></div>
            </section>
            <section id="review-bar" class="panel" hidden>
              <div class="review-controls">
                <label>검토 좌석 <select id="review-seat"></select></label>
                <button id="review-first">⏮</button>
                <button id="review-prev">◀</button>
                <input type="range" id="review-slider" min="0" max="0" value="0">
                <button id="review-next">▶</button>
                <button id="review-last">⏭</button>
                <button id="review-prev-own">이전 내 행동</button>
                <button id="review-next-own">다음 내 행동</button>
                <button id="review-exit">검토 종료</button>
              </div>
              <div class="review-controls review-playback">
                <button id="review-play">재생</button>
                <label>단위
                  <select id="review-unit">
                    <option value="turn" selected>한 턴씩</option>
                    <option value="step">한 수씩</option>
                  </select>
                </label>
                <label>간격
                  <select id="review-interval">
                    <option value="250">0.25초</option>
                    <option value="500">0.5초</option>
                    <option value="1000" selected>1초</option>
                    <option value="2000">2초</option>
                    <option value="4000">4초</option>
                  </select>
                </label>
              </div>
              <div id="review-status" class="meta"></div>
            </section>
            <p id="game-error" class="error" hidden></p>
            <p id="game-note" class="muted" hidden></p>
            <section id="standings" class="panel" hidden></section>
            <section id="disclosure" class="panel" hidden></section>
          </div>
          <div id="side-log">
            <section id="action-log" class="panel" hidden></section>
          </div>
        </aside>
      </div>
      <section id="private-zone" aria-label="내 손패"></section>
    </section>
  </main>

  <div id="card-popover" class="popover" hidden></div>

  <!-- Classic scripts sharing one global scope, so the order is the file's
       old top-to-bottom order and must stay that way: a top-level const is
       in the temporal dead zone until its own script has run. Only app.js
       runs anything at load (init()), so it is last. -->
  <script src="/static/labels.js"></script>
  <script src="/static/core.js"></script>
  <script src="/static/screens.js"></script>
  <script src="/static/session.js"></script>
  <script src="/static/review.js"></script>
  <script src="/static/render.js"></script>
  <script src="/static/turn.js"></script>
  <script src="/static/board.js"></script>
  <script src="/static/panels.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
