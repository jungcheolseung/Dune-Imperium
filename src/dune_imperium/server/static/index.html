<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="html.page_title">듄 임페리움: 봉기</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1 data-i18n="html.page_title">듄 임페리움: 봉기</h1>
    <div id="header-status"></div>
    <span id="connection-note" role="status" hidden data-i18n="html.connection_note">서버 연결 끊김 — 다시 연결하는 중…</span>
    <button id="open-help" title="도움말 (?)" aria-keyshortcuts="Shift+Slash" data-i18n="html.open_help" data-i18n-attr="title=html.open_help_title">도움말</button>
    <button id="language-toggle" lang="en">English</button>
    <button id="open-lobby" hidden data-i18n="html.open_lobby">좌석</button>
    <button id="save-game" hidden data-i18n="html.save_game">저장</button>
    <button id="leave-game" hidden data-i18n="html.leave_game">나가기</button>
  </header>

  <main>
    <section id="setup-screen" class="panel">
      <h2 data-i18n="html.setup_title">새 게임</h2>
      <form id="setup-form">
        <fieldset>
          <legend data-i18n="html.seat_assignment_legend">좌석 배정</legend>
          <div id="seat-selects"></div>
          <label><span data-i18n="html.checkpoint_path_label">체크포인트 경로 (좌석에 "학습 체크포인트"를 고르면 사용; train extra 필요)</span>
            <input type="text" id="opt-checkpoint" placeholder="checkpoints/2026-09-06/champion_iter200.pt"></label>
        </fieldset>
        <fieldset>
          <legend data-i18n="html.rule_options_legend">규칙 옵션</legend>
          <label><input type="checkbox" id="opt-leader-draft" checked>
            <span data-i18n="html.opt_leader_draft">지도자 6종 공개 드래프트 (OQ-007, 공식 규칙 아님)</span></label>
          <label><input type="checkbox" id="opt-choam" checked>
            <span data-i18n="html.opt_choam">초암 모듈</span></label>
          <label><input type="checkbox" id="opt-promo" checked>
            <span data-i18n="html.opt_promo">프로모 카드 (봉기 3장: 아라키스 반란, The Beast's Spoils, Pivotal Gambit; 혈통을 켜면 무자비한 리더십, 불멸을 켜면 틀레이락스 덱에 천재적인 조언자, 파이터도)</span></label>
          <label><input type="checkbox" id="opt-bloodlines" checked>
            <span data-i18n="html.opt_bloodlines">혈통 확장 (사다우카 지휘관·새 카드·지도자 8종)</span></label>
          <label><input type="checkbox" id="opt-tech" checked>
            <span data-i18n="html.opt_tech">기술 모듈 (혈통 필요: 익스 대사관 판·기술 타일 18장·익스의 코타 오닥스)</span></label>
          <label><input type="checkbox" id="opt-immortality" checked>
            <span data-i18n="html.opt_immortality">불멸 확장 (베네 틀레이락스 게임판·틀레이락스 열·접합·새 카드)</span></label>
          <label id="opt-seed-row"><span data-i18n="html.opt_seed_label">시드 (빈칸 = 무작위)</span>
            <input type="number" id="opt-seed" min="0" placeholder="무작위" data-i18n-attr="placeholder=html.opt_seed_placeholder"></label>
        </fieldset>
        <button type="submit" id="create-game" data-i18n="html.create_game">게임 시작</button>
      </form>
      <div id="game-list-wrap" hidden>
        <h2 data-i18n="html.game_list_title">진행 중인 게임</h2>
        <ul id="game-list"></ul>
      </div>
      <div id="save-list-wrap" hidden>
        <h2 data-i18n="html.save_list_title">저장된 게임</h2>
        <ul id="save-list"></ul>
      </div>
      <p id="setup-error" class="error" role="alert" hidden></p>
    </section>

    <section id="landing-screen" class="panel" hidden>
      <h2 data-i18n="html.landing_title">초대받은 사람만 들어올 수 있는 서버입니다</h2>
      <p data-i18n="html.landing_instructions">호스트가 보낸 방 링크로 접속하세요.</p>
      <p class="muted" data-i18n="html.landing_host_note">호스트라면 서버를 띄운 콘솔에 찍힌 관리자 링크를 여세요.</p>
      <p id="landing-resume" hidden>
        <button type="button" id="landing-resume-button" data-i18n="html.landing_resume_button">마지막으로 있던 방으로 이어 하기 ▶</button></p>
      <p id="landing-error" class="error" role="alert" hidden></p>
    </section>

    <section id="lobby-screen" class="panel" hidden>
      <h2 data-i18n="html.lobby_title">좌석 고르기</h2>
      <p id="lobby-status" class="muted"></p>
      <label><span data-i18n="html.lobby_name_label">이름 (다른 플레이어에게 보입니다)</span>
        <input type="text" id="lobby-name" maxlength="20" autocomplete="off"></label>
      <ul id="lobby-seats"></ul>
      <p id="lobby-error" class="error" role="alert" hidden></p>
      <p id="lobby-note" class="muted" hidden></p>
      <button id="lobby-enter" hidden data-i18n="html.lobby_enter">게임 화면으로 ▶</button>
      <div id="lobby-host" hidden></div>
    </section>

    <section id="game-screen" hidden>
      <div id="table">
        <aside id="seats" aria-label="좌석" data-i18n-attr="aria-label=html.seats_aria"></aside>
        <div id="center">
          <section id="board" aria-label="게임 보드" data-i18n-attr="aria-label=html.board_aria"></section>
          <section id="market" aria-label="공용 카드" data-i18n-attr="aria-label=html.market_aria"></section>
        </div>
        <aside id="side">
          <div id="side-main">
            <details id="host-panel" class="panel" hidden>
              <summary data-i18n="html.host_panel_summary">호스트 · 방 링크와 좌석</summary>
              <div id="host-panel-body"></div>
            </details>
            <section id="decision-banner" class="panel">
              <div id="decision-info"></div>
              <div id="actions"></div>
            </section>
            <section id="review-bar" class="panel" hidden>
              <div class="review-controls">
                <label><span data-i18n="html.review_seat_label">검토 좌석</span> <select id="review-seat"></select></label>
                <button id="review-first" aria-label="처음으로" title="처음으로" data-i18n-attr="aria-label=html.review_first;title=html.review_first">⏮</button>
                <button id="review-prev" aria-label="이전 수" title="이전 수" data-i18n-attr="aria-label=html.review_prev;title=html.review_prev">◀</button>
                <input type="range" id="review-slider" min="0" max="0" value="0" aria-label="검토 위치" data-i18n-attr="aria-label=html.review_slider_aria">
                <button id="review-next" aria-label="다음 수" title="다음 수" data-i18n-attr="aria-label=html.review_next;title=html.review_next">▶</button>
                <button id="review-last" aria-label="끝으로" title="끝으로" data-i18n-attr="aria-label=html.review_last;title=html.review_last">⏭</button>
                <button id="review-prev-own"></button>
                <button id="review-next-own"></button>
                <button id="review-exit" data-i18n="html.review_exit">검토 종료</button>
              </div>
              <div class="review-controls review-playback">
                <button id="review-play"></button>
                <label><span data-i18n="html.review_unit_label">단위</span>
                  <select id="review-unit">
                    <option value="turn" selected data-i18n="html.review_unit_turn">한 턴씩</option>
                    <option value="step" data-i18n="html.review_unit_step">한 수씩</option>
                  </select>
                </label>
                <label><span data-i18n="html.review_interval_label">간격</span>
                  <select id="review-interval">
                    <option value="250" data-i18n="html.review_interval_025">0.25초</option>
                    <option value="500" data-i18n="html.review_interval_05">0.5초</option>
                    <option value="1000" selected data-i18n="html.review_interval_1">1초</option>
                    <option value="2000" data-i18n="html.review_interval_2">2초</option>
                    <option value="4000" data-i18n="html.review_interval_4">4초</option>
                  </select>
                </label>
              </div>
              <div id="review-status" class="meta"></div>
            </section>
            <p id="game-error" class="error" role="alert" hidden></p>
            <p id="game-note" class="muted" hidden></p>
            <section id="standings" class="panel" hidden></section>
            <section id="disclosure" class="panel" hidden></section>
          </div>
          <div id="side-log">
            <section id="action-log" class="panel" hidden></section>
          </div>
        </aside>
      </div>
      <section id="private-zone" aria-label="내 손패" data-i18n-attr="aria-label=html.private_zone_aria"></section>
    </section>
  </main>

  <div id="card-popover" class="popover" hidden></div>
  <div id="help" hidden>
    <div id="help-body" role="dialog" aria-modal="true" aria-labelledby="help-title"></div>
  </div>
  <div id="announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
  <div id="bt-zoom" hidden>
    <div id="bt-zoom-body" role="dialog" aria-modal="true" aria-label="Bene Tleilax board"></div>
  </div>

  <!-- Classic scripts sharing one global scope, so the order is the file's
       old top-to-bottom order and must stay that way: a top-level const is
       in the temporal dead zone until its own script has run. Only app.js
       runs anything at load (init()), so it is last. -->
  <script src="/static/labels.js"></script>
  <script src="/static/labels_en.js"></script>
  <script src="/static/prompts_ko.js"></script>
  <script src="/static/ui_text.js"></script>
  <script src="/static/core.js"></script>
  <script src="/static/i18n.js"></script>
  <script src="/static/screens.js"></script>
  <script src="/static/session.js"></script>
  <script src="/static/review.js"></script>
  <script src="/static/render.js"></script>
  <script src="/static/turn.js"></script>
  <script src="/static/board.js"></script>
  <script src="/static/panels.js"></script>
  <script src="/static/help.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
