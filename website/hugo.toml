baseURL = 'https://jungcheolseung.github.io/Dune-Imperium/'
title = 'Dune: Imperium AI'
locale = 'ko-KR'
defaultContentLanguage = 'ko'
defaultContentLanguageInSubdir = false
timeZone = 'Asia/Seoul'
enableRobotsTXT = true
enableEmoji = false
disableKinds = []
summaryLength = 80
capitalizeListTitles = false

[params]
  description = 'Dune: Imperium - Uprising 규칙 엔진과 게임 AI의 개발 기록, 설치 및 사용 안내.'
  repository = 'https://github.com/jungcheolseung/Dune-Imperium'

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[taxonomies]
  category = 'categories'
  tag = 'tags'

[markup]
  [markup.goldmark.renderer]
    unsafe = false
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3


[languages.ko]
  label = '한국어'
  locale = 'ko-KR'
  weight = 1

