<article class="story-card">
  <div class="card-meta">
    {{ with .GetTerms "categories" }}{{ range . }}<a class="tag" href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>{{ end }}{{ else }}<span class="tag">{{ if eq .Section "updates" }}프로젝트 소식{{ else }}안내{{ end }}</span>{{ end }}
    {{ if in (slice "posts" "updates") .Section }}<time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006.01.02" }}</time>{{ end }}
  </div>
  <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
  <p>{{ .Description }}</p>
  <a class="text-link" href="{{ .RelPermalink }}">읽어보기 <span aria-hidden="true">↗</span><span class="sr-only">: {{ .Title }}</span></a>
</article>
