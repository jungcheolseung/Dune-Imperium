<header class="site-header">
  <div class="header-inner wrap">
    <a class="brand" href="{{ .Site.Home.RelPermalink }}" aria-label="{{ i18n "homeLabel" }}">
      <img src="{{ "images/sandworm.svg" | relURL }}" width="36" height="36" alt="">
      <span>DUNE <span class="brand-sub">IMPERIUM AI</span></span>
    </a>
    <nav class="desktop-nav" aria-label="{{ i18n "mainMenu" }}">{{ partial "menu-links.html" . }}</nav>
    <div class="header-tools">
      <a class="search-link" href="{{ (site.GetPage "/search").RelPermalink }}" aria-label="{{ i18n "search" }}">
        <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><span>{{ i18n "search" }}</span>
      </a>
      {{ range .Translations }}<a class="language-switch" href="{{ .RelPermalink }}" hreflang="{{ .Language.Name }}" lang="{{ .Language.Name }}" aria-label="{{ .Language.Label }}">{{ if eq .Language.Name "ko" }}KO{{ else }}EN{{ end }}</a>{{ end }}
      <button class="theme-toggle" type="button" hidden aria-label="{{ i18n "darkMode" }}" aria-pressed="false" data-light-label="{{ i18n "lightMode" }}" data-dark-label="{{ i18n "darkMode" }}">
        <svg class="theme-moon" width="19" height="19" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15A8.5 8.5 0 0 1 9 4a8.5 8.5 0 1 0 11 11Z"/></svg>
        <svg class="theme-sun" width="19" height="19" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
      </button>
      <details class="mobile-nav">
        <summary>{{ i18n "menu" }} <span aria-hidden="true">☰</span></summary>
        <nav aria-label="{{ i18n "mobileMenu" }}">{{ partial "menu-links.html" . }}<a href="{{ .Site.Params.repository }}">GitHub ↗</a></nav>
      </details>
    </div>
  </div>
</header>
