{{ define "main" }}
<div class="wrap search-page">
  {{ partial "breadcrumbs.html" . }}
  <header class="listing-header"><h1>{{ .Title }}</h1><p>{{ .Description }}</p></header>
  <form class="search-form" role="search" action="{{ .RelPermalink }}" {{ range slice "queryEmpty" "queryLoading" "queryResults" "queryNone" "queryError" }}data-{{ . | anchorize }}="{{ i18n . }}" {{ end }}data-search-index="{{ (site.Home.OutputFormats.Get "JSON").RelPermalink }}">
    <label for="search-query">{{ i18n "query" }}</label>
    <div class="search-input-row"><input id="search-query" name="q" type="search" placeholder="{{ i18n "queryPlaceholder" }}" autocomplete="off" maxlength="160" aria-describedby="search-status"><button class="button primary" type="submit">{{ i18n "search" }}</button></div>
  </form>
  <p id="search-status" class="search-status" role="status" aria-live="polite">{{ i18n "queryEmpty" }}</p>
  <ol id="search-results" class="search-results"></ol>
  <p data-search-fallback>{{ i18n "queryFallback" }}</p>
  <nav class="search-shortcuts" aria-label="{{ i18n "shortcuts" }}"><a href="{{ (site.GetPage "/guides/first-game").RelPermalink }}">{{ i18n "firstGame" }} ↗</a><a href="{{ (site.GetPage "/help").RelPermalink }}">{{ i18n "troubleshooting" }} ↗</a><a href="{{ (site.GetPage "/posts").RelPermalink }}">{{ i18n "posts" }} ↗</a><a href="{{ (site.GetPage "/devlog").RelPermalink }}">{{ i18n "devlog" }} ↗</a></nav>
</div>
{{ end }}
