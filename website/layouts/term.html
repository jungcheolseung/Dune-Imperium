{{ define "main" }}
<div class="wrap article-wrap">{{ partial "breadcrumbs.html" . }}<header class="listing-header"><p class="eyebrow">개발 이야기 · 주제별 모아보기</p><h1>{{ .Title }}</h1></header><nav class="filter-links" aria-label="글 분류"><a href="{{ (site.GetPage "/posts").RelPermalink }}">모든 글</a>{{ range site.Taxonomies.categories.Alphabetical }}<a href="{{ .Page.RelPermalink }}"{{ if eq .Page.RelPermalink $.RelPermalink }} aria-current="page"{{ end }}>{{ .Page.Title }}</a>{{ end }}</nav><div class="story-grid listing-grid">{{ range .Pages.ByDate.Reverse }}{{ partial "card.html" . }}{{ end }}</div></div>
{{ end }}
